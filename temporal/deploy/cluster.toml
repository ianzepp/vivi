# The production cluster (operator placement, 2026-11-18): control and
# lane on hub; implement, check and gate on the two studios; review on the
# mini, which is LLM-only (it never builds: its SSD is soldered). One file
# for every host; each worker reads its own [hosts.<name>].

[server]
# hub.local resolves slowly over mDNS; the LAN IP is the same server.
address = "http://192.168.1.237:7233"
namespace = "default"

[routing]
control = "control"
lane = "lane"
agent = "agent-{host}"
# Check and gate share one queue per studio, with one slot, so they take
# turns in the studio's verification tree. Each target's home studio comes
# from its <owner>/<repo>; check and gate both prefer it.
verify = "verify-{host}"
review = "agent-{host}"
agent_hosts = ["studio", "studio-02"]
# Review runs only on the mini (queue agent-mini-m1). Plan stays on the
# control queue until an LLM planner exists; then add plan_hosts = ["mini-m1"].
review_hosts = ["mini-m1"]
verify_hosts = ["studio", "studio-02"]
affinity_wait_s = 60
fallback_wait_s = 600

# Each host's root is its S15 root. A target's trees are
# {root}/trees/<owner>/<repo>/{repo,slots,check,land} and its lane cache
# {root}/cache/<owner>/<repo>.git, both named from the target's remote (S2).
# The studios use the physical Lanes path, never the /vivi link, so the
# builds write to the Lanes drive and worktree paths stay stable.
[hosts.hub]
root = "/vivi"
queues = { control = 50, lane = 2 }

[hosts.studio]
root = "/Volumes/Lanes/vivi"
queues = { agent-studio = 2, verify-studio = 1 }

[hosts.studio-02]
root = "/Volumes/Lanes/vivi"
queues = { agent-studio-02 = 2, verify-studio-02 = 1 }

# 8 GB: two pi processes at most. Its pool's harness has no shell tool.
# ~/vivi is what the mini's /vivi link points at.
[hosts.mini-m1]
root = "~/vivi"
queues = { agent-mini-m1 = 2 }

# The sandbox lane: a tiny Rust crate. main/vivi/main are never touched.
[targets.pump-sandbox]
remote = "git@hub.local:faberlang/pump-sandbox.git"
main = "temporal/main"
branch_prefix = "temporal/"
check_command = "cargo test --quiet"
check_timeout_s = 600

[targets.pump-sandbox.agent]
model = "opencode-go/deepseek-v4.1-flash"
budget_s = 900

[targets.pump-sandbox.lander]
compose = "~/vivi-temporal/bin/compose"
gate = "~/vivi-temporal/bin/gate"
gate_timeout_s = 900

# radix (mini-m1: a repository and its review worktrees only).
# The check builds every test target without running tests (main carries
# about 73 known failures; the gate judges tests against main's baseline).
[targets.radix]
remote = "git@hub.local:faberlang/radix.git"
main = "vivi/main"
branch_prefix = "temporal/"
check_command = "CARGO_BUILD_JOBS=8 CARGO_TERM_COLOR=never cargo test --workspace --lib --bins --tests --no-run --quiet"
check_timeout_s = 1800

[targets.radix.agent]
model = "opencode-go/deepseek-v4.1-flash"
budget_s = 1800

[targets.radix.lander]
compose = "~/vivi-temporal/bin/compose"
gate = "~/vivi-temporal/bin/gate"
gate_timeout_s = 2400

# radix-stress: replays known changes for stress runs (temporal/tools/stress-run),
# landing on the scratch branch temporal/stress/main, never vivi/main. Same
# warm trees as radix. "implement" applies the patch between the brief's
# BEGIN/END PATCH lines, then builds what a real agent builds in its
# worktree; "review" approves. Its needs are `stress-*`, which only log.
# It has radix's remote, so it uses radix's warm trees and cache.
[targets.radix-stress]
remote = "git@hub.local:faberlang/radix.git"
main = "temporal/stress/main"
branch_prefix = "temporal/stress/"
check_command = "CARGO_BUILD_JOBS=8 CARGO_TERM_COLOR=never cargo test --workspace --lib --bins --tests --no-run --quiet"
check_timeout_s = 1800

[targets.radix-stress.agent]
model = "replay"
budget_s = 1800
harness = "sed -n '/^-----BEGIN PATCH-----$/,/^-----END PATCH-----$/p' {brief} | sed '1d;$d' | git apply --3way --whitespace=nowarn && CARGO_BUILD_JOBS=8 CARGO_TERM_COLOR=never cargo test --workspace --lib --bins --tests --no-run --quiet"
review_harness = "echo 'VERDICT: APPROVE'"

[targets.radix-stress.lander]
compose = "~/vivi-temporal/bin/compose"
gate = "~/vivi-temporal/bin/gate"
gate_timeout_s = 2400

[tuning]
max_work_rounds = 3
max_infra_attempts = 3
max_provider_waits = 6
provider_default_wait_ms = 60000
implement_cap_ms = 2400000
heartbeat_ms = 120000
step_cap_ms = 2100000
infra_retry_ms = 10000

[lander]
batch_window_s = 30
max_batch = 8
step_cap_s = 300
gate_cap_s = 2700
hot_paths = []
max_backlog_s = 3600
land_s_per_unit = 180

# The record: status replies, park marks and closes on the need's thread
# in the faberlang project. Only the control worker (hub) writes it. Its
# key (principal hub.temporal, key_81IxaJWESQs, minted 2026-11-18) acts as
# the `temporal` role; marks and closes run for `operator`, which holds the
# needs. A need started on this config must be a real faberlang handle.
[record]
kind = "mcp"
server = "http://127.0.0.1:18190"
project = "qafq0-wfysf-tsqa6-435tp-kckm5"
key_file = "~/.vivi/temporal-mcp.key"
role = "operator"
vivi = "/usr/local/bin/vivi"
# The replay needs (target radix-stress) only log.
log_handles = ["stress-"]
