# Vivi's need pipeline on Temporal (orchestration reset). It is its own
# workspace, so `cargo build` and `cargo test` at the vivi root never compile
# it. Run it from here: `cargo test`. See README.md.
[package]
name = "vivi-temporal"
version = "0.2.0"
edition = "2024"
publish = false
description = "NeedWorkflow, SliceWorkflow and LanderWorkflow on Temporal, with real and stand-in activities"
license = "MIT"

[workspace]

[[bin]]
name = "vivi-temporal"
path = "src/main.rs"

[dependencies]
# The #[activities] and #[workflow_methods] macros expand to paths in these two.
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
temporalio-client = "1.2.0"
# vendored-protox: compile the protos in Rust, so a host without protoc (hub)
# can build the worker.
temporalio-common = { version = "1.2.0", features = ["vendored-protox"] }
temporalio-macros = "1.2.0"
temporalio-sdk = "1.2.0"
temporalio-workflow = "1.2.0"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"

[dev-dependencies]
temporalio-sdk = { version = "1.2.0", features = ["testing"] }
