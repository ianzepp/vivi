[package]
name = "vivi"
version = "22.1.0"
edition = "2024"
description = "Local-first project mailspace for LLM agents"
license = "MIT"
autobins = false

# This package is its own workspace root, so a worktree checked out under
# `worktrees/` builds on its own instead of being adopted by the checkout above it.
# The member crates live under `crates/`.
[workspace]
members = ["crates/*"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
mail-builder = "0.3"
mail-parser = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
vivi-error = { path = "crates/vivi-error" }
vivi-mail = { path = "crates/vivi-mail" }

[[bin]]
name = "vivi"
path = "src/main.rs"

[dependencies]
vivi-util = { path = "crates/vivi-util" }
vivi-storage = { path = "crates/vivi-storage" }
vivi-skills = { path = "crates/vivi-skills" }
vivi-core = { path = "crates/vivi-core" }
vivi-proxy = { path = "crates/vivi-proxy" }
vivi-update = { path = "crates/vivi-update" }
vivi-server = { path = "crates/vivi-server" }
vivi-mind = { path = "crates/vivi-mind" }
vivi-monitor = { path = "crates/vivi-monitor" }
vivi-doctor = { path = "crates/vivi-doctor" }
vivi-report = { path = "crates/vivi-report" }
vivi-error.workspace = true
vivi-mail.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
mail-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
toml.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# vivi server (formerly the vivi-server crate)


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "deflate", "gzip", "json", "rustls-tls", "stream"] }
tempfile = "3"
vivi-mail = { workspace = true, features = ["test-support"] }
tower = { version = "0.5", features = ["util"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
hex = "0.4"
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"

[profile.dev]
incremental = false
debug = "line-tables-only"
