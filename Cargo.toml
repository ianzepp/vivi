[package]
name = "vivi"
version = "14.1.1"
edition = "2024"
description = "Local-first project mailspace for LLM agents"
license = "MIT"
autobins = false

# This package is its own workspace root, so a worktree checked out under
# `worktrees/` builds on its own instead of being adopted by the checkout above it.
[workspace]

[[bin]]
name = "vivi"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-builder = "0.3"
mail-parser = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "json", "rustls-tls", "stream", "zstd"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-stream = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
semver = "1"
flate2 = "1"
tar = "0.4"
sysinfo = "0.32"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
toml = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"

[profile.dev]
incremental = false
debug = "line-tables-only"
