# Railway deploy config for the vivi server. UNUSED leftover (Railway retired
# 2026-10-21).
#
# No secrets or settings here: the image sets VIVI_HOME=/data and reads
# /data/server/config.toml and /data/server/creds/* from the volume (see the
# Dockerfile; `vivi server init` creates them).

[build]
builder = "DOCKERFILE"
dockerfile_path = "Dockerfile"

[deploy]
startCommand = "vivi server run"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# The persistent /data volume must be attached to the service before deploy
# (`railway volume add --mount-path /data` or dashboard); the deploy fails
# closed if it is missing.
requiredMountPath = "/data"
