name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Check release versions
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          crate_version="$(
            awk '
              /^\[package\]/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          test "$crate_version" = "$version"
          if ! grep -Fq "VIVI_VERSION:-${version}" install.sh; then
            echo "install.sh does not default to ${version}" >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="vivi-${{ matrix.target }}.tar.gz"
          tar czf "$archive" vivi
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
          mv "$archive" "${archive}.sha256" ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vivi-${{ matrix.target }}
          path: |
            vivi-${{ matrix.target }}.tar.gz
            vivi-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vivi-aarch64-apple-darwin/vivi-aarch64-apple-darwin.tar.gz
            vivi-aarch64-apple-darwin/vivi-aarch64-apple-darwin.tar.gz.sha256
            vivi-x86_64-apple-darwin/vivi-x86_64-apple-darwin.tar.gz
            vivi-x86_64-apple-darwin/vivi-x86_64-apple-darwin.tar.gz.sha256
            vivi-x86_64-unknown-linux-gnu/vivi-x86_64-unknown-linux-gnu.tar.gz
            vivi-x86_64-unknown-linux-gnu/vivi-x86_64-unknown-linux-gnu.tar.gz.sha256
            install.sh
          generate_release_notes: true
