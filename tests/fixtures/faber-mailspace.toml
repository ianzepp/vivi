region = "iad"
size = "performance-8x"
memory = 32768
tmpfs = "16g"

[pools.pharos.docker]
host = "ssh://pharos"
memory = "12g"
tmpfs = "2g"

[pools.pharos.ssh]

[pools.pharos.local]

[pools.pharos.runpod]
compute = "gpu"
gpu_types = []
gpu_count = 1
cloud = "secure"
container_disk_gb = 40
data_centers = []
ready_timeout = 120

[pools.pharos.github]
app_id = 5274986
private_key = "/redacted/id_ed25519"

[pools.pharos.harness]
name = "pi"
run = "pi -p --model {model} --thinking xhigh --append-system-prompt {rules} @{brief}"
models = [
    "zai/glm-5.3-flash",
    "deepseek/deepseek-flash",
]
env = [
    "ZAI_API_KEY",
    "DEEPSEEK_API_KEY",
]

[pools.pharos.committer]
name = "Ian Zepp"
email = "ian.zepp@protonmail.com"

[pools.pharos.bridge]
enabled = false
