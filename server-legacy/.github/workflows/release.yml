name: Release

# A `v*` tag builds checksummed vivi-server binaries and publishes a GitHub
# Release. Self-hosted servers (hub) install from it; Railway still deploys
# from the `release` branch, separately.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          crate_version="$(
            awk '
              /^\[package\]/ { in_package=1; next }
              /^\[/ && in_package { exit }
              in_package && /^version[[:space:]]*=/ {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          test "$crate_version" = "$version"

      - name: Install Rust toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          archive="vivi-server-${{ matrix.target }}.tar.gz"
          tar czf "$archive" vivi-server
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$archive" > "${archive}.sha256"
          else
            sha256sum "$archive" > "${archive}.sha256"
          fi
          mv "$archive" "${archive}.sha256" ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: vivi-server-${{ matrix.target }}
          path: |
            vivi-server-${{ matrix.target }}.tar.gz
            vivi-server-${{ matrix.target }}.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vivi-server-x86_64-unknown-linux-gnu/vivi-server-x86_64-unknown-linux-gnu.tar.gz
            vivi-server-x86_64-unknown-linux-gnu/vivi-server-x86_64-unknown-linux-gnu.tar.gz.sha256
            vivi-server-aarch64-apple-darwin/vivi-server-aarch64-apple-darwin.tar.gz
            vivi-server-aarch64-apple-darwin/vivi-server-aarch64-apple-darwin.tar.gz.sha256
          generate_release_notes: true
