[package]
name = "vivi-server"
version = "0.1.0"
edition = "2024"
description = "Public chat substrate server hosting persistent vivi mailspace rooms"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
chrono = "0.4"
vivi = { git = "https://github.com/ianzepp/vivi", branch = "main" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
