[package]
name = "vivi-server"
version = "2.2.0"
edition = "2024"
description = "Public server hosting vivi project mailspaces and lightweight chat rooms"

[dependencies]
axum = "0.8"
aes-gcm = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"
chrono = "0.4"
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml_edit = "0.22"
vivi = { git = "https://github.com/ianzepp/vivi", tag = "v21.2.0" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
flate2 = "1"
