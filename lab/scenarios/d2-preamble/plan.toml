# Defect 2: a slicer and hands that write prose before the envelope; the fan-out and the hand classifier must read it.
target = "app"

[world]
machines = 1
slots = 4
agent_secs = 0.3

[world.script]
slicer = ["preamble@c1"]
hand = ["preamble"]

[expect]
landed = 1
exceptions_absent = ["flow-slices-invalid", "flow-envelope-failed"]

[[need]]
id = "n1"
subject = "lab d2-preamble: n1"
done_when = ["the listed unit files exist and ./check.sh passes"]
body = "LAB-NEED: n1"

[[need.slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }"
write_scope = ["src/u1.sh"]

[[need.slice]]
id = "u2"
title = "Add unit u2"
brief = "Create src/u2.sh.\nLAB-EDIT: src/u2.sh u2() { echo u2; }"
write_scope = ["src/u2.sh"]

[[need.slice]]
id = "u3"
title = "Add unit u3"
brief = "Create src/u3.sh.\nLAB-EDIT: src/u3.sh u3() { echo u3; }"
write_scope = ["src/u3.sh"]
