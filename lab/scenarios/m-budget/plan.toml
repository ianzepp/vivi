# Mechanics: a hand that sleeps past a 60 s budget on attempt 1 is killed; the retry lands.
target = "app"

[world]
machines = 1
slots = 4
agent_secs = 0.3
budget = 60
sleep_secs = 90

[expect]
max_secs = 420
landed = 1

[[need]]
id = "n1"
subject = "lab m-budget: n1"
done_when = ["the listed unit files exist and ./check.sh passes"]
body = "LAB-NEED: n1"

[[need.slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }"
write_scope = ["src/u1.sh"]
lab = ["sleep@a1"]

[[need.slice]]
id = "u2"
title = "Add unit u2"
brief = "Create src/u2.sh.\nLAB-EDIT: src/u2.sh u2() { echo u2; }"
write_scope = ["src/u2.sh"]
