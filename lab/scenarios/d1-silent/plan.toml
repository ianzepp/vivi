# Defect 1b: a planner that prints nothing takes the attempt rule (flow-agent-silent), then lands.
target = "app"

[world]
machines = 1
slots = 4
agent_secs = 0.3

[world.script]
planner = ["silent@c1"]

[expect]
landed = 1
exceptions_present = ["flow-agent-silent"]

[[need]]
id = "n1"
subject = "lab d1-silent: n1"
done_when = ["the listed unit files exist and ./check.sh passes"]
body = "LAB-NEED: n1"

[[need.slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }"
write_scope = ["src/u1.sh"]

[[need.slice]]
id = "u2"
title = "Add unit u2"
brief = "Create src/u2.sh.\nLAB-EDIT: src/u2.sh u2() { echo u2; }"
write_scope = ["src/u2.sh"]
