# Generated by gen-plan.py: one need, 50 independent units,
# 2 machine(s) x 5 slot(s).
target = "app"

[world]
machines = 2
slots = 5
agent_secs = 1.0
task_fail_pct = 12.5
need_fail_pct = 5.0

[need]
subject = "lab fail1: add 50 units"
done_when = ["src/u1.sh to src/u50.sh exist and ./check.sh passes"]
body = "Add 50 units, u1 to u50. Each is src/<unit>.sh defining a function named after the file that prints its own name."

[[slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }"
write_scope = ["src/u1.sh"]

