# Mechanics: two parallel slices with disjoint scopes both write notes/shared.txt; the second merge conflicts and is repaired from the need tip.
target = "app"

[world]
machines = 1
slots = 4
agent_secs = 0.3

[expect]
landed = 1
exceptions_present = ["flow-scope-exceeded"]

[[need]]
id = "n1"
subject = "lab m-conflict: n1"
done_when = ["the listed unit files exist and ./check.sh passes"]
body = "LAB-NEED: n1"

[[need.slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }\nLAB-EDIT: notes/shared.txt from u1"
write_scope = ["src/u1.sh"]

[[need.slice]]
id = "u2"
title = "Add unit u2"
brief = "Create src/u2.sh.\nLAB-EDIT: src/u2.sh u2() { echo u2; }\nLAB-EDIT: notes/shared.txt from u2"
write_scope = ["src/u2.sh"]
