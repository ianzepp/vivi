# Defect 8: an exhausted slice and a rework slicer that cuts only what its brief lists as not landed.
target = "app"

[world]
machines = 1
slots = 4
agent_secs = 0.3
rework_strict = true

[expect]
max_secs = 420
landed = 1
briefs_contain = { slicer = "## Slices that did not land" }

[[need]]
id = "n1"
subject = "lab d8-rework: n1"
done_when = ["the listed unit files exist and ./check.sh passes"]
body = "LAB-NEED: n1"

[[need.slice]]
id = "u1"
title = "Add unit u1"
brief = "Create src/u1.sh.\nLAB-EDIT: src/u1.sh u1() { echo u1; }"
write_scope = ["src/u1.sh"]

[[need.slice]]
id = "u2"
title = "Add unit u2"
brief = "Create src/u2.sh.\nLAB-EDIT: src/u2.sh u2() { echo u2; }"
write_scope = ["src/u2.sh"]
lab = ["false_premise@r1"]
