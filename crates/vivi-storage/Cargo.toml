[package]
name = "vivi-storage"
version = "22.1.0"
edition = "2024"
description = "The vivi SQLite message store"
license = "MIT"

[features]
# Exposes test-only storage hooks to the tests of other crates.
test-support = []

[dependencies]
chrono.workspace = true
hex = "0.4"
mail-parser.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
vivi-error.workspace = true
vivi-mail.workspace = true

[dev-dependencies]
tempfile = "3"
vivi-mail = { workspace = true, features = ["test-support"] }
