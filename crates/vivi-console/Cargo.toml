[package]
name = "vivi-console"
version = "24.0.0"
edition = "2024"
description = "The vivi read-only web console, mounted by vivi server under /ui"
license = "MIT"

[dependencies]
vivi-storage = { path = "../vivi-storage" }
vivi-core = { path = "../vivi-core" }
axum = "0.8"
chrono.workspace = true
getrandom = "0.4"
mail-parser.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
vivi-error.workspace = true

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
