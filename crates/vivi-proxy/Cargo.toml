[package]
name = "vivi-proxy"
version = "24.0.0"
edition = "2024"
description = "The vivi model proxy"
license = "MIT"

[dependencies]
vivi-util = { path = "../vivi-util" }
vivi-core = { path = "../vivi-core" }
axum = "0.8"
bytes = "1"
chrono.workspace = true
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "deflate", "gzip", "json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml.workspace = true
tracing = "0.1"
vivi-error.workspace = true

[dev-dependencies]
tempfile = "3"
